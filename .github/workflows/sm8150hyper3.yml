name: Build SM8150 HyperOS Kernel
on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          path: kernel

      - name: Install Build Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y git flex bison gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libssl-dev libelf-dev make zip wget tar

      # 改用LineageOS内核clang压缩包，不用git克隆，规避域名解析问题
      - name: Download Kernel Clang Toolchain
        run: |
          rm -rf clang
          wget https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86-clang-r416183b/releases/download/latest/clang.tar.gz
          mkdir clang
          tar -xf clang.tar.gz -C clang --strip-components=1

      - name: Compile Kernel Image
        run: |
          export ARCH=arm64
          export PATH=$PWD/clang/bin:$PATH
          cd kernel
          make clean && make mrproper
          make oneplus_defconfig
          make -j$(nproc)
