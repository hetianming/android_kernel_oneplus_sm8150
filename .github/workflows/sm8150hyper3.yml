name: Build SM8150 HyperOS Kernel
on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          path: kernel

      - name: Install Basic Dependencies
        run: |
          sudo apt update -y
          sudo apt install git flex bison libssl-dev libelf-dev make zip wget tar xz-utils -y


      - name: Build Kernel Image
  run: |
    export ARCH=arm64
    export PATH=$PWD/clang/bin:$PATH
    cd kernel
    make clean && make mrproper
    # 加载厂商defconfig
    make vendor/sm8150-perf_defconfig
    # 完整语句关闭强堆栈保护（修复截断语法错误）
    scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
    # 多线程编译内核
    make -j$(nproc)
