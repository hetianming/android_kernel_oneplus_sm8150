# 一加SM8150(7/7Pro/7T) HyperOS3内核编译工作流
name: Build Kernel for OnePlus SM8150 (HyperOS3)

# 仅手动触发编译
on:
  workflow_dispatch:

jobs:
  build:
    # 运行环境 Ubuntu22.04
    runs-on: ubuntu-22.04
    steps:
      # 1.拉取LineageOS16.0内核源码
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_oneplus_sm8150
          ref: 16.0

      # 2.安装编译依赖工具链
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget curl python3 xz-utils flex bison \
            openssl libssl-dev libelf-dev libudev-dev libpci-dev \
            libiberty-dev autoconf llvm lld clang gcc g++ make bc cpio \
            build-essential kmod device-tree-compiler zip

      # 3.下载并配置LLVM Clang22.1.8编译器
      - name: Install LLVM Clang 22.1.8
        run: |
          rm -rf clang /tmp/clang.tar.gz
          mkdir -p clang
          # 下载clang压缩包至临时目录
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/clang+llvm-22.1.8-x86_64-linux-gnu.tar.gz -O /tmp/clang.tar.gz
          # 解压clang，去除外层一级目录
          tar -xf /tmp/clang.tar.gz -C clang --strip-components=1
          # 将clang路径写入全局环境变量，后续步骤生效
          echo "PATH=$PWD/clang/bin:$PATH" >> $GITHUB_ENV

      # 4.配置AArch64 GCC 4.9交叉编译器
      - name: Setup GCC (AArch64 4.9)
        run: |
          rm -rf android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
          # 写入交叉编译前缀环境变量
          echo "CROSS_COMPILE=$(pwd)/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/bin/aarch64-linux-android-" >> $GITHUB_ENV

      # 5.加载内核defconfig配置，并关闭不兼容的强堆栈保护
      - name: Configure kernel & disable incompatible stack protector
        run: |
          make O=out ARCH=arm64 vendor/sm8150-perf_defconfig
          scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR_STRONG

      # 6.编译内核镜像（修复重点：run后加 | 支持多行反斜杠换行）
      - name: Build kernel image
        run: |
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }}

      # 7.使用AnyKernel3打包可卡刷zip
      - name: Package with AnyKernel3
        run: |
          rm -rf AnyKernel3 kernel-hyperos.zip
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          # 复制内核镜像
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          # dtbo不存在不报错
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ 2>/dev/null || true
          cd AnyKernel3
          # 写入机型配置，guacamole=一加7Pro
          echo "kernel=Image.gz-dtb" >> anykernel.sh
          echo "device.name=guacamole" >> anykernel.sh
          # 打包zip
          zip -r9 ../kernel-hyperos.zip *

      # 8.上传编译成品zip到工作流产物
      - name: Upload flashable kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: SM8150-HyperOS3-Kernel
          path: kernel-hyperos.zip

      - name: Configure kernel & disable incompatible stack protector
        run: |
          make O=out ARCH=arm64 vendor/sm8150-perf_defconfig
          scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR_STRONG

      - name: Build kernel image
        run: |
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }}

      - name: Package with AnyKernel3
        run: |
          rm -rf AnyKernel3 kernel-hyperos.zip
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ 2>/dev/null || true
          cd AnyKernel3
          echo "kernel=Image.gz-dtb" >> anykernel.sh
          echo "device.name=guacamole" >> anykernel.sh
          zip -r9 ../kernel-hyperos.zip *

      - name: Upload flashable kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: SM8150-HyperOS3-Kernel
          path: kernel-hyperos.zip
          echo "CROSS_COMPILE=$(pwd)/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/bin/aarch64-linux-android-" >> $GITHUB_ENV

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 vendor/sm8150-perf_defconfig

      - name: Build kernel
        run: |
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }}

      - name: Package for AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ 2>/dev/null || true
          cd AnyKernel3
          echo "kernel=Image.gz-dtb" >> anykernel.sh
          echo "device.name=guacamole" >> anykernel.sh   # 按你的设备修改
          zip -r9 ../kernel-hyperos.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: kernel-hyperos.zip
