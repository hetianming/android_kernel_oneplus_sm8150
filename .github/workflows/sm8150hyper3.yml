name: Build OnePlus SM8150 Kernel (LineageOS)

on:
  push:
    branches: [ 16 ]      # 或你选择的分支
  pull_request:
  workflow_dispatch:              # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_oneplus_sm8150
          ref: 16          # 可改为 lineage-21 等

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget curl python3 xz-utils flex bison \
            openssl libssl-dev libelf-dev libudev-dev libpci-dev \
            libiberty-dev autoconf llvm lld clang gcc g++ make bc cpio \
            build-essential kmod device-tree-compiler zip

      - name: Setup Clang (crDroid)
  run: |
    git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547694.git
    # 设置到 PATH
    echo "$(pwd)/android_prebuilts_clang_host_linux-x86_clang-r547694/bin" >> $GITHUB_PATH

          # GCC aarch64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
          echo "CROSS_COMPILE=$HOME/toolchain/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/bin/aarch64-linux-android-" >> $GITHUB_ENV

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 vendor/sm8150-perf_defconfig
          # 如果需要调整 HyperOS 相关选项，可以在此处加入脚本修改 .config

      - name: Build kernel
        run: |
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }}

      - name: Prepare AnyKernel3 package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ 2>/dev/null || true
          cd AnyKernel3
          echo "kernel=Image.gz-dtb" >> anykernel.sh
          echo "device.name=guacamole" >> anykernel.sh   # 根据你的设备修改
          # 如需修改其他参数，请编辑 anykernel.sh
          zip -r9 ../Kernel-Build.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: Kernel-Build.zip
