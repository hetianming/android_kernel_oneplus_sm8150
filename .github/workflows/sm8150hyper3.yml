name: Build SM8150 HyperOS Kernel
on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          path: kernel

      - name: Install Basic Dependencies
        run: |
          sudo apt update -y
          sudo apt install git flex bison libssl-dev libelf-dev make zip wget tar xz-utils -y

      - name: Download LLVM Clang 18.1.8 Official Package
        run: |
          rm -rf clang clang.tar.xz
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz -O clang.tar.xz
          mkdir clang
          tar -xf clang.tar.xz -C clang --strip-components=1

      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export PATH=$PWD/clang/bin:$PATH
          cd kernel
          make clean && make mrproper
          make vendor/sm8150-perf_defconfig
          make -j$(nproc)
